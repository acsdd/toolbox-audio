name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:privacy
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('package-lock.json') }}
      - name: Prepare desktop OAuth configuration
        shell: pwsh
        env:
          GOOGLE_DESKTOP_OAUTH_JSON: ${{ secrets.GOOGLE_DESKTOP_OAUTH_JSON }}
        run: |
          if (-not $env:GOOGLE_DESKTOP_OAUTH_JSON) { throw 'Missing GOOGLE_DESKTOP_OAUTH_JSON release secret' }
          $oauth = $env:GOOGLE_DESKTOP_OAUTH_JSON | ConvertFrom-Json
          if (-not $oauth.client_id -or -not $oauth.client_secret) { throw 'Invalid desktop OAuth configuration' }
          $env:GOOGLE_DESKTOP_OAUTH_JSON | Set-Content -Encoding utf8 config/google-oauth.json
      - name: Prepare optional YouTube search key
        shell: pwsh
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: node scripts/prepare-youtube-key.cjs artistwave/youtube-bundled-config.js
      - name: Package installers
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx electron-builder --win --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "electron-builder attempt $attempt failed; retrying..."
            Start-Sleep -Seconds 10
          }
          exit 1
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe, dist/*.blockmap | Sort-Object Name | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(
            dist/AudioWave-Setup-*.exe
            dist/AudioWave-Setup-*.exe.blockmap
            dist/AudioWave-Portable-*.exe
            dist/SHA256SUMS.txt
          )
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "AudioWave ${GITHUB_REF_NAME#v}" --generate-notes --draft
