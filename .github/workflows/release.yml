name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('package-lock.json') }}
      - name: Package installers
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx electron-builder --win --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "electron-builder attempt $attempt failed; retrying..."
            Start-Sleep -Seconds 10
          }
          exit 1
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(
            dist/ArtistWave-Setup-*.exe
            dist/ArtistWave-Setup-*.exe.blockmap
            dist/ArtistWave-Portable-*.exe
          )
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "ArtistWave ${GITHUB_REF_NAME#v}" --generate-notes